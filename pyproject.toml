[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "tomli; python_version < '3.11'"]
build-backend = "scikit_build_core.build"

[project]
name = "neongammon"
version = "3.2.1"
description = "Neongammon — a neural-network backgammon engine for Apple Silicon (fork of Open Sage / markbgsage/bgsage)"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Mark Higgins" },
]
maintainers = [
    { name = "Hendrik Reh" },
]
keywords = ["backgammon", "neural-network", "game-ai"]
dependencies = [
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/HendrikReh/neongammon"
Repository = "https://github.com/HendrikReh/neongammon"
Issues = "https://github.com/HendrikReh/neongammon/issues"
Upstream = "https://github.com/markbgsage/bgsage"

# ---------------------------------------------------------------------------
# scikit-build-core: CMake-driven build of the pybind11 extension (bgbot_cpp)
# ---------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
# The Python package tree lives under python/, not at the repo root.
wheel.packages = ["python/neongammon"]

# sdist contents: by default scikit-build-core ships every git-tracked file.
#
# This repo tracks ~1 GB of training/benchmark/reference data, and PyPI caps a
# single file at 100 MB. So the policy here is an ALLOWLIST, not a denylist:
# exclude whole trees, then re-add only the handful of files a source build
# actually needs. A denylist was tried first and did not hold — each new
# dataset (money_benchmark, backgame_ref_positions, match_benchmark, …) slipped
# through unnoticed and the sdist grew from 9 MB to 535 MB before this caught it.
sdist.exclude = [
    "data/",
    "models/",
    "backgame_ref_positions/",
    "assets/",
    "scripts/",
    "tests/",
    "logs/",
]
# Exact weight manifest shared with the CMake wheel install. Stage 11 uses
# 21 distinct files; Stage 9 also uses its original race net and two backgame nets.
sdist.include = [
    "data/bearoff_1sided.db",
    "models/sl_s11_bg_containment.weights.best",
    "models/sl_s11_bg_deep.weights.best",
    "models/sl_s11_bg_double.weights.best",
    "models/sl_s11_bg_massive.weights.best",
    "models/sl_s11_bg_middle.weights.best",
    "models/sl_s11_bg_p3.weights.best",
    "models/sl_s11_bg_snake.weights.best",
    "models/sl_s5_purerace.weights.best",
    "models/sl_s9_anch_att.weights.best",
    "models/sl_s9_anch_race.weights.best",
    "models/sl_s9_att_anch.weights.best",
    "models/sl_s9_att_att.weights.best",
    "models/sl_s9_att_prim.weights.best",
    "models/sl_s9_att_race.weights.best",
    "models/sl_s9_opponent_bg.weights.best",
    "models/sl_s9_player_bg.weights.best",
    "models/sl_s9_prim_anch.weights.best",
    "models/sl_s9_prim_att.weights.best",
    "models/sl_s9_prim_race.weights.best",
    "models/sl_s9_purerace.weights.best",
    "models/sl_s9_race_anch.weights.best",
    "models/sl_s9_race_att.weights.best",
    "models/sl_s9_race_prim.weights.best",
    "models/sl_s9_race_race.weights.best",
]

# ---------------------------------------------------------------------------
# cibuildwheel: macOS arm64 wheels for CPython 3.10-3.14
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = [
    "pp*",              # no PyPy
]
build-verbosity = 1
# cibuildwheel copies these tests outside the checkout and installs each wheel
# in a fresh environment. Isolated Python ignores inherited PYTHONPATH entries.
test-requires = ["pytest"]
test-sources = ["tests"]
test-command = """\
python -I -m pytest -q tests/wheel_contents.py tests/test_simulation.py \
tests/test_batch.py tests/test_batch_checker_play.py tests/test_batch_cube_action_nply.py \
tests/test_move_dice.py::test_high_branching_1_1_moves_above_2048_exact_parity"""

[tool.cibuildwheel.macos]
# Apple Silicon only (NEON + Accelerate).
archs = ["arm64"]
