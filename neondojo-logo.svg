<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">NeonDojo</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16302f"/>
      <stop offset="1" stop-color="#091013"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <!-- Checker as rising sun -->
  <g filter="url(#glow)">
    <circle cx="128" cy="126" r="50" fill="#ff4fa3"/>
    <circle cx="128" cy="126" r="33" fill="none" stroke="#091013" stroke-opacity=".32" stroke-width="5"/>
  </g>
  <!-- Board edge -->
  <rect x="40" y="214" width="176" height="6" rx="3" fill="#3df2e0" opacity=".55"/>
  <!-- Torii: pillars are backgammon points -->
  <g fill="#3df2e0" filter="url(#glow)">
    <path d="M79 72 L96 212 L60 212 Z"/>
    <path d="M177 72 L196 212 L160 212 Z"/>
    <rect x="52" y="102" width="152" height="13" rx="3"/>
    <rect x="121" y="80" width="14" height="24"/>
    <path d="M26 54 Q128 80 230 54 L224 74 Q128 98 32 74 Z"/>
  </g>
</svg>
