site_name: NeonGammon Documentation
site_description: Neural-network backgammon engine for Apple Silicon — reference guides, specifications, training runbooks, and benchmarks.
site_url: https://hendrikreh.github.io/neongammon/
repo_url: https://github.com/HendrikReh/neongammon
repo_name: HendrikReh/neongammon
edit_uri: edit/main/docs/
copyright: NeonGammon is licensed under MPL-2.0.

docs_dir: docs
strict: true

# Links from docs/ to files elsewhere in the repository (../cpp/..., ../CLAUDE.md)
# are rewritten to GitHub URLs at build time, so the Markdown stays readable on
# GitHub as well.
hooks:
  - scripts/mkdocs_hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      # GitHub-style heading anchors, so the same #fragment links work on
      # GitHub and on this site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Overview: README.md
  - Usage & API:
      - Engine: engine.md
      - Simulation: simulation.md
      - API reference: api.md
      - Bear-off database: bearoff.md
  - Algorithms & Architecture:
      - Multi-ply search: multi-ply.md
      - Rollouts: rollout.md
  - Training & Benchmarking:
      - Training: training.md
      - Benchmarking: benchmarking.md
      - XG comparison: xg-comparison.md
      - Model benchmarks: model-benchmarks.md
      - Strength references: strength-references.md
  - History & Archives:
      - Model history: model-history.md
      - AI-assisted development: vibing.md
      - Performance handoff 1: performance-handoff.md
      - Performance handoff 2: performance-handoff-2.md
