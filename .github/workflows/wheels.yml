name: Build wheels

on:
  # Release: pushing a v* tag builds wheels and attaches them to the GitHub
  # release of that tag (GitHub releases only, no PyPI).
  # Test-only: PRs to main and manual dispatch build wheels without publishing.
  # Plain pushes to main do NOT trigger CI — commit freely without burning runner time.
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only.
        os: [macos-15]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Build wheels and run installed-wheel pytest suite
        uses: pypa/cibuildwheel@v3.4.1

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Verify sdist manifest and size
        run: python tests/sdist_contents.py

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  verify_sdist_build:
    name: Build and test wheel from sdist (macOS arm64)
    needs: [build_sdist]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: cibw-sdist
          path: dist

      - name: Build wheel from sdist and smoke-test installed package
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps dist/*.tar.gz -w sdist-wheelhouse
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install --no-deps sdist-wheelhouse/*.whl
          /tmp/sdist-venv/bin/python -m pip install 'numpy>=1.24' pytest
          /tmp/sdist-venv/bin/python -I -m pytest -q tests/wheel_contents.py
          /tmp/sdist-venv/bin/python -I -m neongammon info --json
          /tmp/sdist-venv/bin/python -I -m neongammon probe --json

  release_github:
    name: Attach wheels to the GitHub release
    needs: [build_wheels, build_sdist, verify_sdist_build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Upload to the release (created if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "See CHANGELOG.md."
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
