name: Source tests

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  source_tests:
    name: macOS source build and pytest
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source build and test dependencies
        run: python -m pip install 'numpy>=1.24' 'pybind11>=2.12' cmake ninja pytest modal

      - name: Build and run native C++ unit tests (ASan + UBSan)
        run: |
          cmake -S cpp -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBGBOT_BUILD_PYTHON=OFF -DBGBOT_BUILD_APPS=OFF \
            -DBGBOT_BUILD_TESTS=ON -DBGBOT_ENABLE_SANITIZERS=ON
          cmake --build build-asan --target test_native_core --parallel 4
          ./build-asan/test_native_core data/bearoff_1sided.db

      - name: Build the Python extension
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPYBIND11_FINDPYTHON=ON -DPython_EXECUTABLE="$(command -v python)" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build build --target bgbot_cpp --parallel 4

      - name: Run full deterministic pytest suite and mobile parity
        env:
          PYTHONPATH: ${{ github.workspace }}/build:${{ github.workspace }}/python
        run: |
          python -m pytest -q -rs \
            -m "not external_data and not gnubg and not puretd and not mlx" \
            --junitxml=build/source-tests.xml tests
          # Every selected deterministic test must run on the provisioned runner.
          test "$(xmllint --xpath 'count(//testcase/skipped)' build/source-tests.xml)" = 0
